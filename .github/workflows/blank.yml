// ---------------------------------------------------------
// 3. ATTENDANCE MODULE
// ---------------------------------------------------------
class AttendanceScreen extends StatefulWidget {
  const AttendanceScreen({super.key});

  @override
  State<AttendanceScreen> createState() => _AttendanceScreenState();
}

class _AttendanceScreenState extends State<AttendanceScreen> {
  // Sample October 2026 data
  final Map<int, String> _attendanceMap = {
    1: 'Present', 2: 'Present', 3: 'Present', 4: 'Holiday',
    5: 'Present', 6: 'Present', 7: 'Absent', 8: 'Present',
    9: 'Present', 10: 'Present', 11: 'Holiday',
  };

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('Attendance Record'),
        backgroundColor: const Color(0xFF1E3A8A),
        foregroundColor: Colors.white,
      ),
      body: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          // Top Statistics
          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Row(
                mainAxisAlignment: MainAxisAlignment.spaceAround,
                children: [
                  _metricTile('Total Working', '24 Days'),
                  _metricTile('Present', '22 Days', color: Colors.green),
                  _metricTile('Absent', '2 Days', color: Colors.red),
                  _metricTile('Percentage', '91.6%', color: const Color(0xFF1E3A8A)),
                ],
              ),
            ),
          ),
          const SizedBox(height: 20),

          const Text('October 2026 - Daily Attendance', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
          const SizedBox(height: 12),

          // Daily Attendance Table
          Card(
            child: ListView.separated(
              shrinkWrap: true,
              physics: const NeverScrollableScrollPhysics(),
              itemCount: 10,
              separatorBuilder: (_, __) => const Divider(height: 1),
              itemBuilder: (context, index) {
                final day = index + 1;
                final status = _attendanceMap[day] ?? 'Present';
                final dateStr = '2026-10-${day.toString().padLeft(2, '0')}';

                Color statusColor = Colors.green;
                if (status == 'Absent') statusColor = Colors.red;
                if (status == 'Holiday') statusColor = Colors.grey;

                return ListTile(
                  dense: true,
                  leading: Text('$day Oct', style: const TextStyle(fontWeight: FontWeight.bold)),
                  title: Text(DateFormat('EEEE').format(DateTime.parse(dateStr))),
                  trailing: Container(
                    padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                    decoration: BoxDecoration(
                      color: statusColor.withOpacity(0.12),
                      borderRadius: BorderRadius.circular(8),
                    ),
                    child: Text(status, style: TextStyle(color: statusColor, fontWeight: FontWeight.w600, fontSize: 12)),
                  ),
                );
              },
            ),
          ),
        ],
      ),
    );
  }

  static Widget _metricTile(String label, String value, {Color color = Colors.black80}) {
    return Column(
      children: [
        Text(value, style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: color)),
        const SizedBox(height: 2),
        Text(label, style: const TextStyle(fontSize: 11, color: Colors.grey)),
      ],
    );
  }
}


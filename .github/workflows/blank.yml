      'amount': 850,
      'status': 'Paid',
      'receipt': 'BMVM-26-0394',
      'paidOn': '10 Jun 2026',
    },
    {
      'month': 'July 2026',
      'amount': 850,
      'status': 'Paid',
      'receipt': 'BMVM-26-0482',
      'paidOn': '07 Jul 2026',
    },
    {
      'month': 'August 2026',
      'amount': 850,
      'status': 'Paid',
      'receipt': 'BMVM-26-0590',
      'paidOn': '06 Aug 2026',
    },
    {
      'month': 'September 2026',

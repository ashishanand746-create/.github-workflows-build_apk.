  final Map<int, String> _dailyAttendance = {
    1: 'Present',
    2: 'Present',
    3: 'Present',
    4: 'Sunday',
    5: 'Present',
    6: 'Present',
    7: 'Absent',
    8: 'Present',
    9: 'Present',
    10: 'Present',
    11: 'Sunday',
    12: 'Present',
    13: 'Present',
    14: 'Present',
  };

  void _payFee(int index) {
    setState(() {
      _feeLedger[index]['status'] = 'Paid';
      _feeLedger[index]['receipt'] =
          'BMVM-26-${1000 + DateTime.now().millisecond}';
      _feeLedger[index]['paidOn'] = 'Today';
    });
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(
        content: Text(
          'Receipt ${_feeLedger[index]['receipt']} issued for ${_feeLedger[index]['month']}!',
        ),
        backgroundColor: Colors.green.shade800,
      ),
    );
  }

  void _toggleAttendance(int day) {
    setState(() {
      final current = _dailyAttendance[day];
      if (current == 'Present') {
        _dailyAttendance[day] = 'Absent';
      } else if (current == 'Absent') {
        _dailyAttendance[day] = 'Leave';
      } else if (current == 'Leave') {
        _dailyAttendance[day] = 'Present';
      }
    });
  }

  @override
  Widget build(BuildContext context) {
    final screens = [
      _buildHomeDashboard(),
      _buildFeeModule(),
      _buildAttendanceModule(),
      _buildTimetableModule(),
      _buildCalendarModule(),
    ];

    return Scaffold(
      appBar: AppBar(
        backgroundColor: const Color(0xFF1E3A8A),
        foregroundColor: Colors.white,
        elevation: 0,

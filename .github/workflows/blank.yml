  // ---------------------------------------------------------------------------
  // 1. DASHBOARD VIEW
  // ---------------------------------------------------------------------------
  Widget _buildHomeDashboard() {
    int totalPresents = _dailyAttendance.values
        .where((status) => status == 'Present')
        .length;
    int totalAbsents = _dailyAttendance.values
        .where((status) => status == 'Absent')
        .length;
    int workingDays = totalPresents + totalAbsents;
    double percentage = workingDays == 0
        ? 0.0
        : (totalPresents / workingDays) * 100;

    return ListView(
      padding: const EdgeInsets.all(16),
      children: [
        // Welcome Card
        Container(
          padding: const EdgeInsets.all(18),
          decoration: BoxDecoration(
            gradient: const LinearGradient(
              colors: [Color(0xFF1E3A8A), Color(0xFF2563EB)],
              begin: Alignment.topLeft,
              end: Alignment.bottomRight,
            ),
            borderRadius: BorderRadius.circular(16),
          ),
          child: const Row(
            children: [
              CircleAvatar(
                radius: 28,
                backgroundColor: Colors.white24,
                child: Icon(Icons.school, color: Colors.white, size: 30),
              ),
              SizedBox(width: 16),
              Expanded(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(
                      'Session 2026 - 2027',
                      style: TextStyle(color: Colors.white70, fontSize: 12),
                    ),
                    SizedBox(height: 2),
                    Text(
                      'Student Portal',
                      style: TextStyle(
                        color: Colors.white,
                        fontSize: 18,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    Text(
                      'Banmankhi Block • Purnea District',
                      style: TextStyle(color: Colors.white70, fontSize: 11),
                    ),
                  ],
                ),
              ),
            ],
          ),
        ),
        const SizedBox(height: 18),

        // Live Status Grid
        const Text(
          'Quick Overview',
          style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold),
        ),
        const SizedBox(height: 10),
        Row(
          children: [
            Expanded(
              child: _buildMetricBox(
                'Attendance',
                '${percentage.toStringAsFixed(1)}%',
                '$totalPresents Days Present',
                Colors.green,
                Icons.check_circle_outline,
              ),
            ),
            const SizedBox(width: 12),
            Expanded(
              child: _buildMetricBox(
                'October Fee',
                '₹ 850',
                'Status: Due',
                Colors.deepOrange,
                Icons.payment,
              ),
            ),
          ],
        ),
        const SizedBox(height: 12),
        Row(
          children: [
            Expanded(
              child: _buildMetricBox(
                'Today Timetable',
                '7 Periods',
                'Math, Hindi, Science...',
                Colors.indigo,
                Icons.class_outlined,
              ),
            ),
            const SizedBox(width: 12),
            Expanded(
              child: _buildMetricBox(
                'Next Holiday',
                'Durga Puja',
                'Starting 18 Oct',
                Colors.teal,
                Icons.beach_access_outlined,
              ),
            ),
          ],
        ),
        const SizedBox(height: 22),

        // Official Notice Board
        const Text(
          'Notice Board',
          style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold),
        ),
        const SizedBox(height: 8),
        _buildNoticeItem(
          title: 'Half-Yearly Examination Routine',
          date: '03 Oct 2026',
          desc:
              'The schedule for exams (Classes Nursery to 10th) is published. Obtain clearance slips from the office.',
        ),
        _buildNoticeItem(
          title: 'Monthly Fee Submission Counter',
          date: '28 Sep 2026',
          desc:
              'Parents are requested to clear dues by the 10th of each month at the school office counter, Ward No. 03.',
        ),
      ],
    );
  }

  Widget _buildMetricBox(
    String title,
    String value,
    String sub,
    Color col,
    IconData icon,
  ) {
    return Container(
      padding: const EdgeInsets.all(14),
      decoration: BoxDecoration(
        color: Colors.white,
        borderRadius: BorderRadius.circular(14),
        border: Border.all(color: Colors.grey.shade200),
      ),
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          Row(
            mainAxisAlignment: MainAxisAlignment.spaceBetween,
            children: [
              Text(
                title,
                style: TextStyle(color: Colors.grey.shade600, fontSize: 12),
              ),
              Icon(icon, size: 18, color: col),
            ],
          ),
          const SizedBox(height: 8),
          Text(
            value,
            style: TextStyle(
              fontSize: 17,
              fontWeight: FontWeight.bold,
              color: col,
            ),
          ),
          const SizedBox(height: 2),
          Text(
            sub,
            style: TextStyle(color: Colors.grey.shade500, fontSize: 11),
          ),
        ],
      ),
    );
  }

  Widget _buildNoticeItem({
    required String title,
    required String date,
    required String desc,
  }) {
    return Card(
      margin: const EdgeInsets.only(bottom: 10),
      child: Padding(
        padding: const EdgeInsets.all(14),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Row(
              mainAxisAlignment: MainAxisAlignment.spaceBetween,
              children: [
                Expanded(
                  child: Text(
                    title,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                      fontSize: 14,
                    ),
                  ),
                ),
                Text(
                  date,
                  style: TextStyle(color: Colors.grey.shade500, fontSize: 11),
                ),
              ],
            ),
            const SizedBox(height: 6),
            Text(
              desc,
              style: TextStyle(color: Colors.grey.shade700, fontSize: 12),
            ),
          ],
        ),
      ),
    );
  }

  // ---------------------------------------------------------------------------
  // 2. FEE MANAGEMENT VIEW
  // ---------------------------------------------------------------------------
  Widget _buildFeeModule() {
    return ListView(
      padding: const EdgeInsets.all(16),
      children: [
        Container(
          padding: const EdgeInsets.all(16),
          decoration: BoxDecoration(
            color: const Color(0xFFFEF3C7),
            borderRadius: BorderRadius.circular(14),
            border: Border.all(color: const Color(0xFFFDE68A)),
          ),
          child: const Row(
            children: [
              Icon(Icons.info_outline, color: Color(0xFFD97706)),
              SizedBox(width: 12),
              Expanded(
                child: Text(
                  'Monthly tuition fee is ₹ 850. Pay via counter or simulate immediate confirmation below.',
                  style: TextStyle(color: Color(0xFF92400E), fontSize: 12),
                ),
              ),
            ],
          ),
        ),
        const SizedBox(height: 16),
        const Text(
          'Academic Fee Card (2026)',
          style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold),
        ),
        const SizedBox(height: 8),
        ..._feeLedger.asMap().entries.map((entry) {
          final idx = entry.key;
          final item = entry.value;
          final isPaid = item['status'] == 'Paid';
          final isDue = item['status'] == 'Due';

          return Card(
            margin: const EdgeInsets.only(bottom: 10),
            child: ListTile(
              contentPadding: const EdgeInsets.symmetric(
                horizontal: 16,
                vertical: 6,
              ),
              title: Text(
                item['month'],
                style: const TextStyle(
                  fontWeight: FontWeight.bold,
                  fontSize: 14,
                ),
              ),
              subtitle: Text(
                'Amount: ₹${item['amount']} • Paid: ${item['paidOn']}\nReceipt: ${item['receipt']}',
                style: const TextStyle(fontSize: 12),
              ),
              isThreeLine: true,
              trailing: isDue
                  ? ElevatedButton(
                      onPressed: () => _payFee(idx),
                      style: ElevatedButton.styleFrom(
                        backgroundColor: const Color(0xFF1E3A8A),
                        foregroundColor: Colors.white,
                        padding: const EdgeInsets.symmetric(
                          horizontal: 14,
                          vertical: 8,
                        ),
                      ),
                      child: const Text('Pay Now'),
                    )
                  : Chip(
                      label: Text(
                        item['status'],
                        style: TextStyle(
                          color: isPaid ? Colors.green.shade800 : Colors.grey,
                          fontSize: 11,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      backgroundColor: isPaid
                          ? Colors.green.shade50
                          : Colors.grey.shade100,
                    ),
            ),
          );
        }),
      ],
    );
  }

  // ---------------------------------------------------------------------------
  // 3. ATTENDANCE VIEW
  // ---------------------------------------------------------------------------
  Widget _buildAttendanceModule() {
    return ListView(
      padding: const EdgeInsets.all(16),
      children: [
        Container(
          padding: const EdgeInsets.all(14),
          decoration: BoxDecoration(
            color: Colors.white,
            borderRadius: BorderRadius.circular(14),
            border: Border.all(color: Colors.grey.shade200),
          ),
          child: const Row(
            mainAxisAlignment: MainAxisAlignment.spaceAround,
            children: [
              _LegendItem(color: Colors.green, label: 'Present'),
              _LegendItem(color: Colors.red, label: 'Absent'),
              _LegendItem(color: Colors.amber, label: 'Leave'),
              _LegendItem(color: Colors.grey, label: 'Sunday'),
            ],
          ),
        ),
        const SizedBox(height: 16),
        const Text(
          'October 2026 Daily Roll (Tap to change status)',
          style: TextStyle(fontSize: 14, fontWeight: FontWeight.bold),
        ),
        const SizedBox(height: 8),
        Card(
          child: ListView.separated(
            shrinkWrap: true,
            physics: const NeverScrollableScrollPhysics(),
            itemCount: _dailyAttendance.length,
            separatorBuilder: (_, __) => const Divider(height: 1),
            itemBuilder: (context, i) {
              final day = i + 1;
              final status = _dailyAttendance[day] ?? 'Present';

              Color tagColor = Colors.green;
              if (status == 'Absent') tagColor = Colors.red;
              if (status == 'Leave') tagColor = Colors.amber.shade800;
              if (status == 'Sunday') tagColor = Colors.grey;

              return ListTile(
                dense: true,
                onTap: status == 'Sunday' ? null : () => _toggleAttendance(day),
                leading: Text(
                  'Day $day',
                  style: const TextStyle(fontWeight: FontWeight.bold),
                ),
                title: Text('$day October 2026'),
                trailing: Container(
                  padding: const EdgeInsets.symmetric(
                    horizontal: 10,
                    vertical: 4,
                  ),
                  decoration: BoxDecoration(
                    color: tagColor.withOpacity(0.12),
                    borderRadius: BorderRadius.circular(8),
                  ),
                  child: Text(
                    status,
                    style: TextStyle(
                      color: tagColor,
                      fontWeight: FontWeight.bold,
                      fontSize: 12,
                    ),
                  ),
                ),
              );
            },
          ),
        ),
      ],
    );
  }

